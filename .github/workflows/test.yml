name: Test

# Runs the unit test suite (no network, no model weights required) on every
# push and pull request. Tests use synthetic tensors / mocked HTTP responses
# -- none depend on downloading the real DrumSep checkpoint. realweights-
# marked tests are deselected by pyproject.toml's addopts regardless.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Verify selected interpreter
        run: uv run --no-sync python -c 'import os, sys; expected = tuple(map(int, os.environ["UV_PYTHON"].split("."))); assert sys.version_info[:2] == expected, sys.version'

      - name: Run unit tests
        run: uv run --no-sync pytest tests/ -q
