name: Test

# Run offline unit tests across the supported Python range and a separate
# real-checkpoint end-to-end reference test on Python 3.11.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Verify selected interpreter
        run: uv run --no-sync python -c 'import os, sys; expected = tuple(map(int, os.environ["UV_PYTHON"].split("."))); assert sys.version_info[:2] == expected, sys.version'

      - name: Run unit tests
        run: uv run --no-sync pytest tests/ -q

  real-demix-parity:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Download verified DrumSep checkpoint and YAML
        run: |
          mkdir -p "$RUNNER_TEMP/drumsep"
          gh release download weights-drumsep-v1 \
            --repo openmirlab/mdxnet-infer \
            --pattern '*.ckpt' --pattern '*.yaml' \
            --dir "$RUNNER_TEMP/drumsep"

      - name: Compare all six stems with pristine upstream capture
        env:
          MDXNET_REAL_CHECKPOINT: ${{ runner.temp }}/drumsep/aufr33-jarredou_DrumSep_model_mdx23c_ep_141_sdr_10.8059.ckpt
          MDXNET_REAL_CONFIG: ${{ runner.temp }}/drumsep/aufr33-jarredou_DrumSep_model_mdx23c_ep_141_sdr_10.8059.yaml
        run: uv run --no-sync pytest tests/test_real_demix_parity.py -q -o addopts='' -m realweights
