name: Release verification

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.10'

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ -q

  real-demix-parity:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Download verified DrumSep checkpoint and YAML
        run: |
          mkdir -p "$RUNNER_TEMP/drumsep"
          gh release download weights-drumsep-v1 \
            --repo openmirlab/mdxnet-infer \
            --pattern '*.ckpt' --pattern '*.yaml' \
            --dir "$RUNNER_TEMP/drumsep"

      - name: Compare all six stems with pristine upstream capture
        env:
          MDXNET_REAL_CHECKPOINT: ${{ runner.temp }}/drumsep/aufr33-jarredou_DrumSep_model_mdx23c_ep_141_sdr_10.8059.ckpt
          MDXNET_REAL_CONFIG: ${{ runner.temp }}/drumsep/aufr33-jarredou_DrumSep_model_mdx23c_ep_141_sdr_10.8059.yaml
        run: uv run --no-sync pytest tests/test_real_demix_parity.py -q -o addopts='' -m realweights

  build:
    needs: [test, real-demix-parity]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*
